<!DOCTYPE html>
<html>
<head>
    <title>HTML & CSS Journey</title>

    <style>
        .box {
            width: 45%;
            height: 180px;
            display: inline-block;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            margin: 10px;
            border: 2px solid green;
            border-radius: 10px;
        }

        h1 { color: darkblue; }
        h2 { color: brown; }
    </style>
</head>

<body>

    <div class="box" style="border-color: blue;">
        <h1>Welcome to HTML & CSS Journey</h1>
        <h2>Inline CSS</h2>
        <p>CSS written inside tag</p>
    </div>

    <div class="box">
        <h1>Welcome to HTML & CSS Journey</h1>
        <h2>Internal CSS</h2>
        <p>CSS written inside head tag</p>
    </div>

    <div class="box" style="border-color: orange;">
        <h1>Welcome to HTML & CSS Journey</h1>
        <h2>External CSS</h2>
        <p>CSS written inside CSS file</p>
    </div>
</body>
</html>
