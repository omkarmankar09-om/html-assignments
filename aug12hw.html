<!DOCTYPE html>
<html>
<head>
    <title>Instagram - Create Account</title>
</head>

<body>

    <br><br>

    <table align="center" border="1" cellpadding="12" cellspacing="0" width="400">

        <tr>
            <td align="center">

                <h1>Instagram</h1>

                <h3>Create a new account</h3>

                <p>Sign up to connect with friends and share your moments.</p>

                <hr>

                <form>

                    <table align="center" cellpadding="7">

                        <tr>
                            <td><b>Mobile / Email</b></td>
                            <td>
                                <input type="text" placeholder="Enter mobile or email">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Full Name</b></td>
                            <td>
                                <input type="text" placeholder="Enter full name">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Username</b></td>
                            <td>
                                <input type="text" placeholder="Choose username">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Password</b></td>
                            <td>
                                <input type="password" placeholder="Create password">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Date of Birth</b></td>
                            <td>
                                <input type="date">
                            </td>
                        </tr>

                        <tr>
                            <td><b>Profile Photo</b></td>
                            <td>
                                <input type="file">
                            </td>
                        </tr>

                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Create Account">
                            </td>
                        </tr>

                    </table>

                </form>

                <hr>

                <p>Already have an account?</p>

                <input type="button" value="Log In">

            </td>
        </tr>

    </table>

    <p align="center">
        © 2026 Instagram | Terms | Privacy
    </p>

</body>
</html>
