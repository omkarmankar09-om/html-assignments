<!DOCTYPE html>
<html>
<head>
    <title>Images in Table</title>
</head>

<body>

    <h1>Images in Table</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th>Image</th>
            <th>Name</th>
        </tr>

        <tr>
            <td>
                <a href="https://www.google.com" target="_blank">
                    <img src="google.jpg" width="150" height="100">
                </a>
            </td>
            <td>Google</td>
        </tr>

        <tr>
            <td>
                <a href="https://www.github.com" target="_blank">
                    <img src="github.jpg" width="150" height="100">
                </a>
            </td>
            <td>GitHub</td>
        </tr>

    </table>

</body>
</html>
